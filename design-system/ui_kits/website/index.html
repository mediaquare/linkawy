<!-- @dsCard group="Website" viewport="1440x900" name="Linkawy website (EN / AR)" subtitle="Homepage, GEO service page, blog post — toggle language in the header" -->
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkawy — Website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="content.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeTop.jsx"></script>
<script type="text/babel" src="HomeBottom.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
function App() {
  const [lang, setLang] = React.useState(() => localStorage.getItem('lk-kit-lang') || 'en');
  const [page, setPage] = React.useState(() => localStorage.getItem('lk-kit-page') || 'home');
  const t = window.LK_CONTENT[lang];
  React.useEffect(() => {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    localStorage.setItem('lk-kit-lang', lang);
  }, [lang]);
  React.useEffect(() => { localStorage.setItem('lk-kit-page', page); }, [page]);
  const scrollTo = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: 'smooth' }); };
  const go = (p, anchor) => { setPage(p); setTimeout(() => anchor ? scrollTo(anchor) : window.scrollTo({ top: 0 }), 30); };
  const props = { t, lang, go, scrollTo };
  return (
    <>
      <SiteHeader t={t} lang={lang} page={page} go={go} toggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')} />
      {page === 'home' && <>
        <HomeHero {...props} /><HomeServices {...props} /><HomeProof {...props} /><HomeStrategy {...props} /><HomePartners {...props} />
        <HomeProcess {...props} /><HomeReasons {...props} /><HomeBenefits {...props} /><HomeBlog {...props} /><HomeFounder {...props} />
        <HomeFaq {...props} /><HomeResults {...props} /><HomeContact {...props} />
        <SiteFooter t={t} lang={lang} go={go} />
      </>}
      {page === 'service' && <><ServicePage {...props} /><SiteFooter t={t} lang={lang} go={go} withCta={false} /></>}
      {page === 'blog' && <><BlogPost {...props} /><SiteFooter t={t} lang={lang} go={go} withCta={false} /></>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
