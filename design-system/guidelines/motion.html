<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;color:var(--fg-on-light-1)}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:12px;border:1px solid rgba(0,0,0,.06)}.n{font:600 13px/1.4 var(--font-en);margin-top:8px;color:#141414}.v{font:400 12px/1.4 ui-monospace,monospace;color:#6B6863}.dk{background:var(--dark)}.dk .n{color:#fff}.dk .v{color:#A1A1A1}.m{font:400 12px/1.4 ui-monospace,monospace;color:#6B6863}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">--ease-out</div><div class="m">cubic-bezier(.22,1,.36,1)</div></div><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">--dur-fast · 150ms</div><div class="m">hover colors, press</div></div><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">--dur-base · 250ms</div><div class="m">card lift, icon rotate</div></div><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">--dur-slow · 400ms</div><div class="m">accordion open</div></div><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">marquee · 40s linear</div><div class="m">client logos</div></div><div style="border:1px solid #E8E2D8;border-radius:12px;padding:10px 12px"><div style="font:600 13px var(--font-en)">reduced motion</div><div class="m">marquee stops</div></div></div></body></html>
